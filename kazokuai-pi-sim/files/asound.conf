pcm.USB_PnP_Sound_Device {
	type asym
	playback.pcm { type pulse; server "unix:/mnt/wslg/PulseServer"; device "kazokuai_handset" }
	capture.pcm { type pulse; server "unix:/mnt/wslg/PulseServer"; device "kazokuai_handset_mic" }
	hint { show on; description "USB PnP Sound Device (受話器)" }
}

pcm.!default { type pulse; server "unix:/mnt/wslg/PulseServer" }
ctl.!default { type pulse; server "unix:/mnt/wslg/PulseServer" }
