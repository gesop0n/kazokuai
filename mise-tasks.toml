# mise のタスク。mise.toml の [task_config] includes から読み込む。
# ツールの版と分けておくと、タスクを変えても CI の mise のキャッシュが外れない

[check]
description = "PR を出す前に通すチェック。CI でも同じものを動かす"
depends = ["check:mobile", "check:scripts", "check:go", "check:rules"]

["check:mobile"]
description = "Flutter のアプリのフォーマット、静的解析、テスト、Web のビルド"
dir = "{{config_root}}/mobile"
run = [
  "dart format --output=none --set-exit-if-changed lib test",
  "flutter analyze",
  "flutter test",
  "flutter build web",
]

["check:go"]
description = "Go のデバイスとバックエンドのフォーマット、静的解析、テスト。テストは Firebase のエミュレーターの中で動かす"
dir = "{{config_root}}"
run = [
  'test -z "$(gofmt -l backend device internal | tee /dev/stderr)"',
  "go vet ./...",
  # テストは毎回新しいエミュレーターを使うので、前の結果を使い回さない
  "scripts/emulators_exec.sh 'go test -count=1 ./...'",
]

["check:rules"]
description = "Firestore のセキュリティルールのテスト。Firestore のエミュレーターに対して動かす"
dir = "{{config_root}}"
run = [
  "npm ci --prefix firebase --no-audit --no-fund --silent",
  "scripts/emulators_exec.sh 'npm --prefix firebase test'",
]

["check:scripts"]
description = "scripts/ のテスト"
run = "python3 -I -m unittest discover -s {{config_root}}/scripts -p '*_test.py'"

[backend]
description = "バックエンドを起動する。GEMINI_API_KEY が要る。先に emulators を起動しておく。見守る方の ID は電話機に渡す"
dir = "{{config_root}}"
# firebase/firebase.json のポートと合わせる
env = { FIREBASE_AUTH_EMULATOR_HOST = "127.0.0.1:9099", FIRESTORE_EMULATOR_HOST = "127.0.0.1:8081" }
run = "go run ./backend"

[device]
description = "Mac で電話機のプログラムを起動する。イヤホンを付けて使う。先に backend を起動しておく。例: mise run device -- --watched-person <見守る方の ID>"
dir = "{{config_root}}"
run = "go run ./device"

[emulators]
description = "Firebase の Auth と Firestore のエミュレーターを起動する。エミュレーターの画面は http://localhost:4000"
dir = "{{config_root}}/firebase"
# Hosting は本番の Web 版用。ここは demo-kazokuai の Auth と Firestore だけを起動する
run = "firebase emulators:start --project demo-kazokuai --only auth,firestore"

[translate]
description = "英語の Markdown を plamo-translate で日本語に訳す。例: mise run translate en.md ja.md"
run = "python3 -I {{config_root}}/scripts/plamo_translate.py"

[launcher-icons]
description = "元の画像から iOS と Android のホーム画面のアイコンを作り直す"
dir = "{{config_root}}/mobile"
run = "dart run tool/launcher_icons.dart"
