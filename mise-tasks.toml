# mise のタスク。mise.toml の [task_config] includes から読み込む。
# ツールの版と分けておくと、タスクを変えても CI の mise のキャッシュが外れない

[check]
description = "PR を出す前に通すチェック。CI でも同じものを動かす"
depends = ["check:mobile", "check:scripts", "check:go"]

["check:mobile"]
description = "Flutter のアプリのフォーマット、静的解析、テスト"
dir = "{{config_root}}/mobile"
run = [
  "dart format --output=none --set-exit-if-changed lib test",
  "flutter analyze",
  "flutter test",
]

["check:go"]
description = "Go のデバイスとバックエンドのフォーマット、静的解析、テスト"
dir = "{{config_root}}"
run = [
  'test -z "$(gofmt -l backend device internal | tee /dev/stderr)"',
  "go vet ./...",
  "go test ./...",
]

["check:scripts"]
description = "scripts/ のテスト"
run = "python3 -I -m unittest discover -s {{config_root}}/scripts -p '*_test.py'"

[backend]
description = "バックエンドを起動する。GEMINI_API_KEY が要る。例: mise run backend -- --name 山田花子 --call-name ハナさん"
dir = "{{config_root}}"
run = "go run ./backend"

[device]
description = "Mac で電話機のプログラムを起動する。イヤホンを付けて使う。先に backend を起動しておく"
dir = "{{config_root}}"
run = "go run ./device"

[emulators]
description = "Firebase の Auth と Firestore のエミュレーターを起動する。エミュレーターの画面は http://localhost:4000"
dir = "{{config_root}}/firebase"
run = "firebase emulators:start --project demo-kazokuai"

[translate]
description = "英語の Markdown を plamo-translate で日本語に訳す。例: mise run translate en.md ja.md"
run = "python3 -I {{config_root}}/scripts/plamo_translate.py"
