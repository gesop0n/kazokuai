<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1440">
    <title>かぞくAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <style>
        :root {
            /* 東京都カラーユニバーサルデザインガイドライン(推奨配色セット)を基準にした配色 */
            --paper-base: #F5F5F5;
            --paper-raised: #FFFFFF;
            --paper-sunken: #E2E3E6;
            --ink: #1A1A1A;
            --ink-2: #4D5359;
            --ink-3: #6E757C;
            --line: #C8C8CB;
            --line-strong: #7F878F;
            --alert: #DC3800;
            --ok: #35A16B;
            --ok-soft: #D5F5E3;
            --care: #FF9900;
            --care-soft: #FFFF99;
            --alert-soft: #FFE3E3;
            --night: #1F2328;
            --night-raised: #2D3238;
            --night-line: #7F878F;
            --night-text: #FFFFFF;
            --night-text-2: #D0D3D8;
            --radius: 8px;
            --sans: "BIZ UDPGothic", sans-serif;
            --num: "BIZ UDPGothic", sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        html,
        body {
            background: #E4DCCB
        }

        body {
            width: 1440px;
            font-family: var(--sans);
            color: var(--ink);
            -webkit-font-smoothing: antialiased
        }

        button {
            font: inherit;
            color: inherit;
            background: none;
            border: 0;
            cursor: pointer
        }

        svg {
            display: block;
            flex: none
        }

        .display {
            font: 900 32px/42px var(--sans);
            letter-spacing: .02em
        }

        .title-l {
            font: 700 24px/32px var(--sans);
            letter-spacing: .02em
        }

        .title-m {
            font: 700 18px/26px var(--sans);
            letter-spacing: .02em
        }

        .label-l {
            font: 700 16px/24px var(--sans);
            letter-spacing: .02em
        }

        .label-m {
            font: 500 14px/20px var(--sans);
            letter-spacing: .02em
        }

        .label-s {
            font: 500 12px/16px var(--sans);
            letter-spacing: .02em
        }

        .body-m {
            font: 400 15px/24px var(--sans);
            letter-spacing: .02em
        }

        .body-s {
            font: 400 13px/20px var(--sans);
            letter-spacing: .02em
        }

        .cap-l {
            font: 700 26px/40px var(--sans);
            letter-spacing: .04em
        }

        .cap-m {
            font: 500 17px/28px var(--sans);
            letter-spacing: .04em
        }

        .cap-s {
            font: 500 14px/22px var(--sans);
            letter-spacing: .03em
        }

        .mono-l {
            font: 400 52px/56px var(--num);
            letter-spacing: -.02em
        }

        .mono-m {
            font: 500 14px/18px var(--num)
        }

        .mono-s {
            font: 400 12px/16px var(--num)
        }

        .muted {
            color: var(--ink-2)
        }

        .nmuted {
            color: var(--night-text-2)
        }

        /* Board */
        .board {
            width: 1440px;
            padding: 72px 64px 96px;
            display: flex;
            flex-direction: column;
            gap: 96px
        }

        .intro {
            display: flex;
            justify-content: space-between;
            gap: 64px;
            align-items: flex-start
        }

        .intro-main {
            width: 560px;
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .principles {
            display: flex;
            gap: 32px;
            flex: 1
        }

        .principle {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 2px solid var(--ink);
            padding-top: 12px
        }

        .flow {
            display: flex;
            flex-direction: column;
            gap: 32px
        }

        .flow-head {
            display: flex;
            align-items: baseline;
            gap: 16px
        }

        .row {
            display: flex;
            gap: 64px;
            align-items: flex-start
        }

        .cell {
            width: 393px;
            display: flex;
            flex-direction: column;
            gap: 16px
        }

        .cell-title {
            display: flex;
            gap: 10px;
            align-items: baseline
        }

        .note {
            color: var(--ink-2)
        }

        .why {
            display: flex;
            flex-direction: column;
            gap: 10px
        }

        .why dl {
            display: grid;
            grid-template-columns: 64px 1fr;
            gap: 6px 8px;
            border-top: 1px solid var(--line-strong);
            padding-top: 10px
        }

        .why dt {
            font: 700 12px/20px var(--sans);
            letter-spacing: .02em
        }

        .why dd {
            font: 400 13px/20px var(--sans);
            letter-spacing: .02em;
            color: var(--ink-2)
        }

        /* Alignment with the contest */
        .brief {
            display: flex;
            flex-direction: column;
            gap: 32px
        }

        .brief-grid {
            display: grid;
            grid-template-columns: 393px 1fr;
            gap: 64px;
            align-items: start
        }

        .brief-side {
            display: flex;
            flex-direction: column;
            gap: 24px
        }

        .theme {
            padding: 24px;
            border-radius: 24px;
            background: var(--night);
            color: var(--night-text);
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .fact {
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 2px solid var(--ink);
            padding-top: 12px
        }

        .crit {
            width: 100%;
            border-collapse: collapse
        }

        .crit th {
            font: 700 12px/16px var(--sans);
            letter-spacing: .02em;
            text-align: left;
            color: var(--ink-2);
            padding: 0 16px 8px 0;
            border-bottom: 2px solid var(--ink)
        }

        .crit td {
            padding: 10px 16px 10px 0;
            border-bottom: 1px solid var(--line-strong);
            vertical-align: top;
            font: 400 13px/20px var(--sans);
            letter-spacing: .02em
        }

        .crit td:first-child {
            width: 262px;
            color: var(--ink-2)
        }

        .crit td:last-child {
            width: 108px;
            padding-right: 0;
            font: 400 12px/20px var(--num)
        }

        .crit .group td {
            padding-top: 20px;
            font: 700 14px/20px var(--sans);
            color: var(--ink);
            border-bottom: 0;
            padding-bottom: 0
        }

        .tri {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px
        }

        .tri ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .tri li {
            font: 400 13px/20px var(--sans);
            letter-spacing: .02em;
            color: var(--ink-2);
            padding-left: 1em;
            text-indent: -1em
        }

        .tri li::before {
            content: "・"
        }

        /* Screen */
        .screen {
            width: 393px;
            height: 852px;
            position: relative;
            overflow: hidden;
            background: var(--paper-base);
            flex: none
        }

        .screen.night {
            background: var(--night);
            color: var(--night-text)
        }

        .status {
            position: absolute;
            left: 0;
            top: 0;
            width: 393px;
            height: 54px;
            padding: 20px 24px 8px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font: 600 16px/20px var(--sans);
            z-index: 5
        }

        .homebar {
            height: 34px;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 8px;
            flex: none
        }

        .homebar i {
            display: block;
            width: 134px;
            height: 5px;
            border-radius: 3px;
            background: currentColor
        }

        .content {
            position: absolute;
            left: 0;
            top: 54px;
            width: 393px;
            display: flex;
            flex-direction: column
        }

        .foot {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 393px;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        /* Atoms */
        .avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            color: #fff;
            flex: none
        }

        .avatar.S {
            width: 24px;
            height: 24px;
            font: 500 12px/16px var(--sans)
        }

        .avatar.M {
            width: 36px;
            height: 36px;
            font: 700 16px/24px var(--sans)
        }

        .iconbtn {
            width: 44px;
            height: 44px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: none
        }

        .iconbtn.tinted {
            background: var(--paper-sunken)
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: var(--radius);
            flex: none
        }

        .btn.L {
            height: 56px;
            padding: 0 24px;
            font: 700 16px/24px var(--sans);
            letter-spacing: .02em
        }

        .btn.M {
            height: 44px;
            padding: 0 16px;
            font: 500 14px/20px var(--sans);
            letter-spacing: .02em
        }

        .btn.primary {
            background: var(--ink);
            color: var(--paper-raised)
        }

        .btn.primary:disabled {
            background: #D5D6D9;
            color: var(--ink-2);
            cursor: not-allowed
        }

        .btn.secondary {
            background: var(--paper-raised);
            color: var(--ink);
            border: 1.5px solid var(--line-strong)
        }

        .btn.secondary:disabled {
            background: #D5D6D9;
            color: var(--ink-2);
            cursor: not-allowed
        }

        .agreebox {
            width: 44px;
            height: 56px;
            margin-left: -10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex: none
        }

        .agreebox i {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1.5px solid var(--line-strong);
            display: flex;
            align-items: center;
            justify-content: center
        }

        .agreebox svg {
            display: none
        }

        .agreebox[aria-checked="true"] i {
            background: var(--ink);
            border-color: var(--ink)
        }

        .agreebox[aria-checked="true"] svg {
            display: block
        }

        .agreebox:disabled {
            cursor: not-allowed
        }

        .agreebox:disabled i {
            background: var(--paper-sunken)
        }

        .btn.ghost {
            color: var(--ink-2)
        }

        .btn.ghost-night {
            color: var(--night-text)
        }

        .link {
            text-decoration: underline;
            text-underline-offset: 3px
        }

        .btn.light {
            background: var(--night-text);
            color: var(--night)
        }

        .fillw {
            width: 100%
        }

        .field {
            min-height: 56px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            border-radius: var(--radius);
            background: var(--paper-raised);
            border: 1.5px solid var(--line-strong)
        }

        .field[hidden] {
            display: none
        }

        .topic-x {
            display: none;
            position: absolute;
            right: 4px;
            top: 4px;
            width: 20px;
            height: 20px;
            align-items: center;
            justify-content: center
        }

        .field:not(:only-child)>.topic-x {
            display: flex
        }

        .field input[data-topic-input] {
            font: 500 14px/20px var(--sans);
            letter-spacing: .02em
        }

        .field input::placeholder {
            color: var(--ink-2);
            opacity: 1
        }

        .field input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            background: none;
            font: 500 16px/24px var(--num);
            color: var(--ink)
        }

        .field.focus {
            border: 2px solid var(--ink)
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap
        }

        .chip-hit {
            padding: 4px 0;
            flex: none
        }

        .chip {
            height: 36px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: var(--radius);
            background: var(--paper-raised);
            border: 1px solid var(--line-strong);
            font: 500 14px/20px var(--sans);
            letter-spacing: .02em;
            white-space: nowrap
        }

        .chip.sel {
            background: var(--ink);
            color: var(--paper-raised);
            border-color: var(--ink)
        }

        .dockact {
            height: 56px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
            justify-content: center;
            font: 500 12px/16px var(--sans);
            letter-spacing: .02em;
            color: var(--ink-2)
        }

        .dockact.on {
            color: var(--ink);
            font-weight: 700
        }

        .dockact.on::before {
            content: "";
            position: absolute;
            left: 20px;
            right: 20px;
            top: -1px;
            height: 3px;
            background: var(--ink)
        }

        .dock {
            display: grid;
            grid-template-columns: repeat(3, 1fr)
        }

        .tabbar {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 393px;
            background: var(--paper-raised);
            border-top: 1px solid var(--line-strong);
            display: flex;
            flex-direction: column;
            z-index: 4
        }

        .sheet {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 393px;
            background: var(--paper-raised);
            border-radius: var(--radius) var(--radius) 0 0;
            box-shadow: 0 -6px 24px rgba(0, 0, 0, .18);
            display: flex;
            flex-direction: column;
            z-index: 4
        }

        .card {
            padding: 16px;
            border-radius: var(--radius);
            background: var(--paper-raised);
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .nightcard {
            padding: 20px;
            border-radius: var(--radius);
            background: var(--night);
            color: var(--night-text);
            display: flex;
            flex-direction: column
        }

        .ai-tag {
            display: flex;
            gap: 6px;
            align-items: center
        }

        .steps {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .step {
            display: flex;
            gap: 12px;
            align-items: flex-start
        }

        .step b {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--ink);
            color: var(--paper-raised);
            display: flex;
            align-items: center;
            justify-content: center;
            font: 700 14px/20px var(--sans);
            flex: none
        }

        .illus {
            border-radius: var(--radius);
            background: var(--paper-sunken);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px
        }

        .prog {
            display: flex;
            gap: 6px
        }

        .prog i {
            display: block;
            height: 4px;
            flex: 1;
            border-radius: 2px;
            background: var(--line-strong)
        }

        .prog i.on {
            background: var(--ink)
        }

        /* Home */
        .hhead {
            position: absolute;
            left: 0;
            top: 54px;
            width: 393px;
            height: 60px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--paper-base);
            z-index: 3
        }

        .hview {
            position: absolute;
            left: 0;
            top: 114px;
            width: 393px;
            height: 738px;
            overflow: hidden
        }

        .hcol {
            position: absolute;
            left: 16px;
            width: 361px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 12px
        }

        .state {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding-top: 12px;
            border-top: 1px solid var(--line)
        }

        .state:first-of-type {
            border-top: 0;
            padding-top: 0
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            height: 24px;
            padding: 0 8px;
            border-radius: var(--radius);
            font: 700 12px/16px var(--sans);
            letter-spacing: .02em;
            flex: none;
            color: var(--ink);
            border: 1px solid var(--ink-2)
        }

        .pill.care {
            background: var(--care-soft)
        }

        .pill.ok {
            background: var(--ok-soft)
        }

        .pill.alert {
            background: var(--alert-soft)
        }

        /* Timeline */
        .tl-day {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 8px 16px
        }

        .tl-row {
            display: flex;
            gap: 8px;
            padding: 0 16px
        }

        .tl-time {
            width: 40px;
            flex: none;
            padding-top: 14px;
            color: var(--ink-2)
        }

        .tl-rail {
            width: 24px;
            flex: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 10px
        }

        .tl-rail i {
            display: block;
            width: 2px;
            flex: 1;
            background: var(--line-strong);
            margin-top: 4px;
            opacity: .5
        }

        .tl-card {
            flex: 1;
            min-width: 0;
            margin-bottom: 10px;
            padding: 12px;
            border-radius: var(--radius);
            background: var(--paper-raised);
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        .tl-card.miss {
            background: var(--alert-soft);
            border: 2px solid var(--alert)
        }

        /* Calendar */
        .mini {
            margin: 0 16px 4px;
            width: 361px;
            padding: 8px;
            cursor: pointer;
            border-radius: var(--radius);
            background: var(--paper-raised);
            border: 1px solid var(--line);
            display: flex;
            flex-direction: column;
            gap: 4px;
            text-align: left
        }

        .mini-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 8px;
            height: 24px
        }

        .mini-days {
            display: grid;
            grid-auto-flow: column;
            grid-auto-columns: calc(100%/7);
            overflow-x: auto;
            scrollbar-width: none;
            scroll-snap-type: x mandatory
        }

        .mini-day {
            scroll-snap-align: start
        }

        .mini-days::-webkit-scrollbar {
            display: none
        }

        .mini-day {
            height: 60px;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px
        }

        .mini-day.sel {
            background: var(--ink);
            color: var(--paper-raised)
        }

        .mark {
            height: 12px;
            display: flex;
            align-items: center;
            justify-content: center
        }

        .mark i {
            display: block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--line-strong)
        }

        .mini-day.sel .mark i {
            background: var(--paper-raised)
        }

        .scrim {
            position: absolute;
            left: 0;
            top: 0;
            width: 393px;
            height: 852px;
            background: rgba(0, 0, 0, .5);
            z-index: 3
        }

        .grip {
            height: 20px;
            padding-top: 8px;
            display: flex;
            justify-content: center;
            flex: none
        }

        .grip i {
            display: block;
            width: 40px;
            height: 4px;
            border-radius: 2px;
            background: var(--line-strong)
        }

        .cal {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            row-gap: 2px
        }

        .cal-w {
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink-2)
        }

        .cal-d {
            height: 50px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1px
        }

        .cal-d b {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 500 14px/18px var(--num)
        }

        .cal-d.sel b {
            background: var(--ink);
            color: var(--paper-raised)
        }

        .cal-d.today b {
            box-shadow: inset 0 0 0 1.5px var(--ink)
        }

        .cal-d.future b {
            color: var(--ink-3);
            font-weight: 400
        }

        /* T1〜T3: はじめてのチュートリアル */
        .tut {
            position: absolute;
            inset: 0;
            z-index: 6
        }

        .tut-spot {
            position: absolute;
            border-radius: 14px;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, .62);
            outline: 2px solid #FFFFFF;
            pointer-events: none
        }

        .tut-tip {
            position: absolute;
            left: 16px;
            width: 361px;
            padding: 16px;
            border-radius: var(--radius);
            background: var(--paper-raised);
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, .25)
        }

        .tut:not(.placed) .tut-tip,
        .tut:not(.placed) .tut-spot {
            visibility: hidden
        }

        /* 01b: 予約の日時を選ぶ */
        .cal.book .cal-d {
            height: 40px
        }

        .cal-d.past b {
            color: var(--line-strong);
            font-weight: 400
        }

        .cal-d.past {
            cursor: default
        }

        .wheel {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 4px;
            height: 180px;
            border-radius: var(--radius);
            background: var(--paper-base)
        }

        .wheel-band {
            position: absolute;
            left: 12px;
            right: 12px;
            top: 72px;
            height: 36px;
            border-radius: var(--radius);
            background: var(--paper-sunken);
            pointer-events: none
        }

        .wheel-col {
            position: relative;
            width: 88px;
            height: 180px;
            overflow-y: auto;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
            padding: 72px 0;
            -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent);
            mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent)
        }

        .wheel-col::-webkit-scrollbar {
            display: none
        }

        .wheel-col button {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 36px;
            scroll-snap-align: center;
            font: 400 22px/28px var(--num);
            color: var(--ink-3)
        }

        .wheel-col button.on {
            font-weight: 700;
            font-size: 26px;
            color: var(--ink)
        }

        .wheel-colon {
            position: relative;
            font: 700 26px/28px var(--num)
        }

        .quick {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .quick .chip {
            height: 32px;
            padding: 0 12px;
            font-family: var(--num)
        }

        .often-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok)
        }

        /* Log */
        .log {
            display: flex;
            flex-direction: column;
            gap: 12px
        }

        .say {
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 8px
        }

        .say .t {
            padding-top: 2px;
            color: var(--ink-2)
        }

        .say .who {
            font: 700 12px/16px var(--sans);
            letter-spacing: .02em
        }

        .say.flag .who {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .say.flag .txt {
            background: var(--care-soft);
            border: 1px solid var(--ink-2);
            border-radius: 8px;
            padding: 4px 8px;
            margin: 2px 0 0 -8px
        }

        [data-retry] .chip {
            padding: 0 12px
        }

        /* Setup */
        .topic-scroll {
            overflow-y: auto;
            scrollbar-gutter: stable
        }

        .topic-scroll::-webkit-scrollbar {
            width: 4px
        }

        .topic-scroll::-webkit-scrollbar-thumb {
            background: var(--line-strong);
            border-radius: 2px
        }

        @supports not selector(::-webkit-scrollbar) {
            .topic-scroll {
                scrollbar-width: thin;
                padding-right: 4px !important
            }
        }

        .topics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px
        }

        .topic {
            height: 64px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-radius: var(--radius);
            background: var(--paper-raised);
            border: 1px solid var(--line-strong);
            font: 700 14px/20px var(--sans);
            letter-spacing: .02em
        }

        .topic svg {
            position: absolute;
            right: 6px;
            top: 6px;
            display: none
        }

        .topic[aria-pressed="true"] {
            background: var(--ink);
            color: var(--paper-raised);
            border-color: var(--ink)
        }

        .topic[aria-pressed="true"] svg {
            display: block
        }

        .voice {
            flex-direction: row;
            align-items: center;
            padding: 10px 8px 10px 12px;
            cursor: pointer
        }

        .voice[aria-checked="true"] {
            border: 2px solid var(--ink);
            padding: 9px 7px 9px 11px
        }

        .voice .radio {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1.5px solid var(--line-strong);
            flex: none
        }

        .voice[aria-checked="true"] .radio {
            border: 7px solid var(--ink)
        }

        .setrow {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            min-height: 60px;
            text-align: left;
            border-top: 1px solid var(--line)
        }

        .setrow:first-child {
            border-top: 0
        }

        .cell.flash .screen {
            animation: flash 1.4s ease-out
        }

        @keyframes flash {

            0%,
            50% {
                outline: 4px solid var(--ink);
                outline-offset: 4px
            }

            100% {
                outline: 4px solid transparent;
                outline-offset: 4px
            }
        }

        /* Foundations */
        .found {
            display: flex;
            flex-direction: column;
            gap: 32px
        }

        .found-grid {
            display: flex;
            gap: 64px;
            align-items: flex-start
        }

        .swatches {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            width: 760px
        }

        .swatch {
            width: 112px;
            display: flex;
            flex-direction: column;
            gap: 6px
        }

        .swatch i {
            display: block;
            height: 64px;
            border-radius: 12px;
            border: 1px solid rgba(0, 0, 0, .25)
        }

        .spec {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px
        }

        .spec>div {
            display: flex;
            flex-direction: column;
            gap: 4px
        }

        /* 認証コードの入力(L3k) */
        .code {
            display: flex;
            gap: 8px
        }

        .code i {
            flex: 1;
            height: 60px;
            border-radius: var(--radius);
            background: var(--paper-raised);
            border: 1.5px solid var(--line-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            font: 700 28px/36px var(--num);
            font-style: normal;
            color: var(--ink)
        }

        .code i.cur {
            border: 2px solid var(--ink)
        }

        .code.err i {
            border: 2px solid var(--alert);
            background: var(--alert-soft)
        }

        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            padding-bottom: 4px
        }

        .keypad button {
            height: 48px;
            border-radius: 12px;
            background: var(--paper-raised);
            border: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: center;
            font: 500 24px/32px var(--num);
            color: var(--ink)
        }

        .keypad button:active {
            background: var(--paper-sunken)
        }

        .keypad button.blank {
            visibility: hidden
        }
    </style>
</head>

        const INK = '#1A1A1A', INK2 = '#4D5359', RAISED = '#FFFFFF', SUNKEN = '#E2E3E6', ALERT = '#DC3800', OK = '#35A16B', CARE = '#FF9900', NIGHT = '#1F2328', NLINE = '#7F878F', NTEXT = '#FFFFFF', NTEXT2 = '#D0D3D8', NRAISED = '#2D3238', AI_C = '#0041FF', HANA = '#663300', GREY = '#7F878F';

            col.addEventListener('pointermove', e => { if (sy === null) return; const d = e.clientY - sy; if (Math.abs(d) > 4) moved = true; if (moved) col.scrollTop = st - d });
            window.addEventListener('pointerup', () => { if (sy === null) return; sy = null; col.style.scrollSnapType = ''; spinTo(col, col.children[Math.round(col.scrollTop / ITEM_H)].dataset.v, true) });
            col.addEventListener('click', e => { if (moved) { e.stopPropagation(); moved = false } }, true);
        });
        if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { placeHome(); placeTut() });

        // ---------- 操作 ----------
        const goTo = n => { const c = document.querySelector(`[data-cell="${n}"]`); if (!c) return; c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash') };
        const renderRetry = () => { document.querySelector('[data-retry-flow]').innerHTML = retryFlow(); document.querySelector('[data-retry-text]').textContent = retryText() };
        const setRetry = (kind, raw) => { const v = Number(raw); if (Number.isInteger(v) && v >= 1 && v <= RETRY_MAX[kind]) { retry[kind] = v; renderRetry() } };
        // L7: 押した候補と、入力した話題を合わせて数える
        const syncTopicCount = box => { const typed = [...box.querySelectorAll('[data-topic-input]')].filter(i => i.value.trim()).length; box.querySelector('[data-topic-count]').textContent = `${box.querySelectorAll('.topic[aria-pressed="true"]').length + typed}つ選択中` };
        let editingBooking = 0;
        let agreeFlowStarted = false;
        // L2d: 2つともチェックされているときだけ登録できる
        const syncRegister = () => { const c = document.querySelector('[data-cell="L2d"]'), all = [...c.querySelectorAll('.agreebox')].every(b => b.getAttribute('aria-checked') === 'true'); c.querySelectorAll('[data-register]').forEach(b => { b.disabled = !all; if (all) b.removeAttribute('aria-disabled'); else b.setAttribute('aria-disabled', 'true') }) };
        document.addEventListener('click', e => {
            const t = e.target;
            const play = t.closest('[data-play]');
            if (play) { const stop = play.dataset.playing === '1'; document.querySelectorAll('[data-play]').forEach(b => { b.dataset.playing = '0'; b.innerHTML = icon('play', 18) }); if (!stop) { play.dataset.playing = '1'; play.innerHTML = icon('square', 18) } }
            const voice = t.closest('.voice');
            if (voice) voice.parentElement.querySelectorAll('.voice').forEach(v => v.setAttribute('aria-checked', v === voice ? 'true' : 'false'));
            const topicBtn = t.closest('.topic');
            if (topicBtn) { topicBtn.setAttribute('aria-pressed', topicBtn.getAttribute('aria-pressed') === 'true' ? 'false' : 'true'); const box = topicBtn.closest('.screen'); syncTopicCount(box) }
            const removeTopic = t.closest('[data-remove-topic]');
            if (removeTopic) { const box = removeTopic.closest('.screen'); removeTopic.parentElement.remove(); syncTopicCount(box) }
            const addTopic = t.closest('[data-add-topic]');
            if (addTopic) { const list = addTopic.parentElement.querySelector('[data-topic-inputs]'); list.insertAdjacentHTML('beforeend', topicInput('ほかの話題を入力')); const scroller = addTopic.closest('[data-topic-scroll]'); list.lastElementChild.querySelector('input').focus({ preventScroll: true }); scroller.scrollTop = scroller.scrollHeight }
            const chip = t.closest('[data-retry] .chip');
            if (chip) { const row = chip.parentElement, kind = row.dataset.retry, field = row.nextElementSibling, other = chip.dataset.v === 'other'; row.querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', c === chip)); field.hidden = !other; if (other) { const inp = field.querySelector('input'); inp.focus(); setRetry(kind, inp.value) } else setRetry(kind, chip.dataset.v) }
            if (t.closest('[data-save-rule]')) document.querySelectorAll('[data-rule-summary]').forEach(el => { el.textContent = retrySummary() });
            if (t.closest('[data-save-topics]')) { const box = t.closest('.screen'), names = [...box.querySelectorAll('.topic[aria-pressed="true"]')].map(b => b.textContent.trim()).concat([...box.querySelectorAll('[data-topic-input]')].map(i => i.value.trim()).filter(Boolean)); document.querySelector('[data-topic-summary]').textContent = names.join('、') || '未選択' }
            if (t.closest('[data-save-voice]')) document.querySelector('[data-voice-summary]').textContent = t.closest('.screen').querySelector('.voice[aria-checked="true"] .label-l').textContent;
            const box = t.closest('.agreebox');
            if (box) {
                // L2d: 押すたびにオンとオフが切り替わる(L2bは無効なのでここに来ない)
                agreeFlowStarted = true;
                box.setAttribute('aria-checked', box.getAttribute('aria-checked') === 'true' ? 'false' : 'true');
                syncRegister();
                return;
            }
            const agreeBtn = t.closest('[data-agree]');
            if (agreeBtn) {
                const boxes = [...document.querySelectorAll('[data-cell="L2d"] .agreebox')];
                // L2dは最初「同意後」の見本として両方チェック済み。操作を始めたら実際の状態に切り替える
                if (!agreeFlowStarted) { agreeFlowStarted = true; boxes.forEach(b => b.setAttribute('aria-checked', 'false')) }
                boxes.find(b => b.dataset.doc === agreeBtn.dataset.agree).setAttribute('aria-checked', 'true');
                syncRegister();
                agreeBtn.dataset.go = 'L2d';
            }
            const resetSend = t.closest('[data-reset-send]');
            if (resetSend) {
                // 送信後は同じ画面に結果を出し、ボタンはログインへ戻る操作に変える
                resetSend.closest('.screen').querySelector('[data-reset-done]').style.display = 'flex';
                resetSend.removeAttribute('data-reset-send');
                resetSend.textContent = 'ログインにもどる';
                resetSend.dataset.go = 'L2';
                return;
            }
            const bookedItem = t.closest('[data-booked]');
            if (bookedItem) {
                // 押した予約の内容を06bに入れる
                editingBooking = Number(bookedItem.dataset.booked);
                const b = BOOKED[editingBooking], form = document.querySelector('[data-cell="06b"]');
                form.querySelectorAll('[data-book]').forEach(i => { i.value = b[i.dataset.book] });
                form.querySelector('[data-book-script]').innerHTML = b.script;
            }
            if (t.closest('[data-save-booking]')) {
                // 保存した内容を06の行に反映する。空欄は元の値のまま
                const b = BOOKED[editingBooking], form = document.querySelector('[data-cell="06b"]');
                form.querySelectorAll('[data-book]').forEach(i => { b[i.dataset.book] = i.value.trim() || b[i.dataset.book] });
                const row = document.querySelector(`[data-booked="${editingBooking}"]`);
                row.querySelector('[data-b-when]').textContent = `${b.date} ${b.time}`;
                row.querySelector('[data-b-content]').textContent = b.content;
            }
            const single = t.closest('[data-single] .chip');
            if (single) single.parentElement.querySelectorAll('.chip').forEach(c => c.classList.toggle('sel', c === single));
            // 01b: 日付はカレンダー、時刻はアラームのような回転式で選ぶ。決定すると01の日付と時刻に反映する
            const whenDay = t.closest('[data-when] [data-day]');
            if (whenDay && !whenDay.disabled) { const sh = whenDay.closest('[data-when]'); sh.querySelectorAll('[data-day]').forEach(b => b.classList.toggle('sel', b === whenDay)); whenLabel(sh) }
            const wheelItem = t.closest('.wheel-col button');
            if (wheelItem) spinTo(wheelItem.parentElement, wheelItem.dataset.v, true);
            const quick = t.closest('[data-quick]');
            if (quick) { const sh = quick.closest('[data-when]'), [h, m] = quick.dataset.quick.split(':'); spinTo(sh.querySelector('[data-col="h"]'), h, true); spinTo(sh.querySelector('[data-col="m"]'), m, true) }
            if (t.closest('[data-when-done]')) {
                const sh = t.closest('[data-when]'), [d, tm] = whenValue(sh);
                document.querySelectorAll('[data-pick="date"]').forEach(el => { el.textContent = d });
                document.querySelectorAll('[data-pick="time"]').forEach(el => { el.textContent = tm });
            }
            // L3k: 数字キーで認証コードを入力する。6桁そろうと「送信」が押せる
            const key = t.closest('[data-key]');
            if (key) {
                const scr = key.closest('.screen'), code = scr.querySelector('[data-code]');
                let v = code.dataset.code;
                if (code.classList.contains('err')) { code.classList.remove('err'); v = ''; const m = scr.querySelector('[data-code-err]'); if (m) m.style.display = 'none' }
                v = key.dataset.key === 'del' ? v.slice(0, -1) : (v + key.dataset.key).slice(0, 6);
                code.dataset.code = v;
                [...code.children].forEach((c, i) => { c.textContent = v[i] || ''; c.classList.toggle('cur', i === v.length) });
                const send = scr.querySelector('[data-send]'); send.disabled = v.length < 6;
                if (send.disabled) send.setAttribute('aria-disabled', 'true'); else send.removeAttribute('aria-disabled');
            }
            const go = t.closest('[data-go]');
            if (go && go.dataset.go === '07') { const from = go.closest('[data-cell]').dataset.cell; document.querySelectorAll('[data-cell="07"] [data-go]').forEach(b => { b.dataset.go = from }) }
            if (go && !go.disabled) goTo(go.dataset.go);
        });
        // 規約とポリシー: 読んだ割合を線に出し、最後まで読むと「同意する」を押せるようにする
        document.querySelectorAll('[data-legal]').forEach(el => {
            const box = el.closest('.screen'), bar = box.querySelector('[data-legal-bar]'), btn = box.querySelector('.foot button');
            const update = () => {
                const seen = el.scrollTop + el.clientHeight; bar.style.width = `${Math.min(100, seen / el.scrollHeight * 100)}%`; bar.parentElement.setAttribute('aria-valuenow', Math.round(Math.min(100, seen / el.scrollHeight * 100)));
                if (btn.disabled && seen >= el.scrollHeight - 4) { btn.disabled = false; btn.removeAttribute('aria-disabled'); btn.removeAttribute('style'); btn.classList.add('primary'); btn.dataset.agree = el.closest('[data-cell]').dataset.cell }
            };
            el.addEventListener('scroll', update); update();
            if (document.fonts && document.fonts.ready) document.fonts.ready.then(update);
        });
        document.addEventListener('input', e => { if (e.target.matches('[data-topic-input]')) syncTopicCount(e.target.closest('.screen')); const k = e.target.dataset && e.target.dataset.retryInput; if (k) setRetry(k, e.target.value) });
        // 過去7日間: 最新の日を右端に置き、ドラッグで前の日へ。ドラッグ後はタップ扱いにしない
        document.querySelectorAll('.mini-days').forEach(el => {
            el.scrollLeft = el.scrollWidth;
            let startX = null, startL = 0, moved = false;
            el.addEventListener('pointerdown', e => { moved = false; if (e.pointerType !== 'mouse') return; startX = e.clientX; startL = el.scrollLeft; el.style.scrollSnapType = 'none' });
            el.addEventListener('pointermove', e => { if (startX === null) return; const d = e.clientX - startX; if (Math.abs(d) > 5) moved = true; if (moved) el.scrollLeft = startL - d });
            window.addEventListener('pointerup', () => { if (startX === null) return; startX = null; el.style.scrollSnapType = '' });
            el.addEventListener('click', e => { if (moved) { e.stopPropagation(); moved = false } }, true);
        });
    </script>
</body>
