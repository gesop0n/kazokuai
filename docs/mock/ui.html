<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>かぞくAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@600&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
:root{
  /* 東京都カラーユニバーサルデザインガイドライン(推奨配色セット)を基準にした配色 */
  --paper-base:#F1F1F1;--paper-raised:#FFFFFF;--paper-sunken:#E2E3E6;
  --ink:#1A1A1A;--ink-2:#4D5359;--ink-3:#6E757C;--line:#C8C8CB;--line-strong:#7F878F;
  --record:#0041FF;--on-record:#FFFFFF;--alert:#DC3800;--ok:#35A16B;--ok-soft:#D5F5E3;--care:#FF9900;--care-soft:#FFFF99;--alert-soft:#FFE3E3;
  --night:#1F2328;--night-raised:#2D3238;--night-line:#7F878F;--night-text:#FFFFFF;--night-text-2:#D0D3D8;
  --zen:"Zen Maru Gothic",sans-serif;--mono:"DM Mono",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#E4DCCB}
body{width:1440px;font-family:var(--zen);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{display:block;flex:none}

.display{font:900 32px/42px var(--zen);letter-spacing:.02em}
.title-l{font:700 24px/32px var(--zen);letter-spacing:.02em}
.title-m{font:700 18px/26px var(--zen);letter-spacing:.02em}
.label-l{font:700 16px/24px var(--zen);letter-spacing:.02em}
.label-m{font:500 14px/20px var(--zen);letter-spacing:.02em}
.label-s{font:500 12px/16px var(--zen);letter-spacing:.02em}
.body-m{font:400 15px/24px var(--zen);letter-spacing:.02em}
.body-s{font:400 13px/20px var(--zen);letter-spacing:.02em}
.cap-l{font:700 26px/40px var(--zen);letter-spacing:.04em}
.cap-m{font:500 17px/28px var(--zen);letter-spacing:.04em}
.cap-s{font:500 14px/22px var(--zen);letter-spacing:.03em}
.mono-l{font:400 52px/56px var(--mono);letter-spacing:-.02em}
.mono-m{font:500 14px/18px var(--mono)}
.mono-s{font:400 12px/16px var(--mono)}
.muted{color:var(--ink-2)}
.nmuted{color:var(--night-text-2)}

/* Board */
.board{width:1440px;padding:72px 64px 96px;display:flex;flex-direction:column;gap:96px}
.intro{display:flex;justify-content:space-between;gap:64px;align-items:flex-start}
.intro-main{width:560px;display:flex;flex-direction:column;gap:12px}
.principles{display:flex;gap:32px;flex:1}
.principle{flex:1;display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--ink);padding-top:12px}
.flow{display:flex;flex-direction:column;gap:32px}
.flow-head{display:flex;align-items:baseline;gap:16px}
.row{display:flex;gap:64px;align-items:flex-start}
.cell{width:393px;display:flex;flex-direction:column;gap:16px}
.cell-title{display:flex;gap:10px;align-items:baseline}
.note{color:var(--ink-2)}
.why{display:flex;flex-direction:column;gap:10px}
.why dl{display:grid;grid-template-columns:64px 1fr;gap:6px 8px;border-top:1px solid var(--line-strong);padding-top:10px}
.why dt{font:700 12px/20px var(--zen);letter-spacing:.02em}
.why dd{font:400 13px/20px var(--zen);letter-spacing:.02em;color:var(--ink-2)}

/* Alignment with the contest */
.brief{display:flex;flex-direction:column;gap:32px}
.brief-grid{display:grid;grid-template-columns:393px 1fr;gap:64px;align-items:start}
.brief-side{display:flex;flex-direction:column;gap:24px}
.theme{padding:24px;border-radius:24px;background:var(--night);color:var(--night-text);display:flex;flex-direction:column;gap:12px}
.fact{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--ink);padding-top:12px}
.crit{width:100%;border-collapse:collapse}
.crit th{font:700 12px/16px var(--zen);letter-spacing:.02em;text-align:left;color:var(--ink-2);padding:0 16px 8px 0;border-bottom:2px solid var(--ink)}
.crit td{padding:10px 16px 10px 0;border-bottom:1px solid var(--line-strong);vertical-align:top;font:400 13px/20px var(--zen);letter-spacing:.02em}
.crit td:first-child{width:262px;color:var(--ink-2)}
.crit td:last-child{width:108px;padding-right:0;font:400 12px/20px var(--mono)}
.crit .group td{padding-top:20px;font:700 14px/20px var(--zen);color:var(--ink);border-bottom:0;padding-bottom:0}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}
.tri ul{list-style:none;display:flex;flex-direction:column;gap:4px}
.tri li{font:400 13px/20px var(--zen);letter-spacing:.02em;color:var(--ink-2);padding-left:1em;text-indent:-1em}
.tri li::before{content:"・"}

/* Screen */
.screen{width:393px;height:852px;position:relative;overflow:hidden;background:var(--paper-base);flex:none}
.screen.night{background:var(--night);color:var(--night-text)}
.status{position:absolute;left:0;top:0;width:393px;height:54px;padding:20px 24px 8px 32px;display:flex;justify-content:space-between;align-items:center;font:600 16px/20px Inter,sans-serif;z-index:5}
.homebar{height:34px;display:flex;justify-content:center;align-items:flex-end;padding-bottom:8px;flex:none}
.homebar i{display:block;width:134px;height:5px;border-radius:3px;background:currentColor}
.content{position:absolute;left:0;top:54px;width:393px;display:flex;flex-direction:column}
.foot{position:absolute;left:0;bottom:0;width:393px;padding:0 16px;display:flex;flex-direction:column;gap:4px}

/* Atoms */
.avatar{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;color:#fff;flex:none}
.avatar.S{width:24px;height:24px;font:500 12px/16px var(--zen)}
.avatar.M{width:36px;height:36px;font:700 16px/24px var(--zen)}
.iconbtn{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.iconbtn.tinted{background:var(--paper-sunken)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;flex:none}
.btn.L{height:56px;padding:0 24px;font:700 16px/24px var(--zen);letter-spacing:.02em}
.btn.M{height:44px;padding:0 16px;font:500 14px/20px var(--zen);letter-spacing:.02em}
.btn.primary{background:var(--ink);color:var(--paper-raised)}
.btn.secondary{background:var(--paper-raised);color:var(--ink);border:1.5px solid var(--line-strong)}
.btn.record{background:var(--record);color:var(--on-record)}
.btn.ghost{color:var(--ink-2)}
.btn.ghost-night{color:var(--night-text)}
.btn.light{background:var(--night-text);color:var(--night)}
.fillw{width:100%}
.field{min-height:56px;padding:0 16px;display:flex;align-items:center;border-radius:16px;background:var(--paper-raised);border:1.5px solid var(--line-strong)}
.field.focus{border:2px solid var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-hit{padding:4px 0;flex:none}
.chip{height:36px;padding:0 16px;display:flex;align-items:center;gap:8px;border-radius:999px;background:var(--paper-raised);border:1px solid var(--line-strong);font:500 14px/20px var(--zen);letter-spacing:.02em;white-space:nowrap}
.chip.sel{background:var(--ink);color:var(--paper-raised);border-color:var(--ink)}
.dockact{width:88px;height:56px;border-radius:16px;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;font:500 12px/16px var(--zen);letter-spacing:.02em;flex:none;color:var(--ink-2)}
.dockact.on{background:var(--paper-sunken);color:var(--ink);font-weight:700}
.dock{display:flex;justify-content:space-between;align-items:center;padding:8px 24px 0}
.sheet{position:absolute;left:0;bottom:0;width:393px;background:var(--paper-raised);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;z-index:4}
.card{padding:16px;border-radius:20px;background:var(--paper-raised);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.nightcard{padding:20px;border-radius:24px;background:var(--night);color:var(--night-text);display:flex;flex-direction:column}
.ai-tag{display:flex;gap:6px;align-items:center}
.steps{display:flex;flex-direction:column;gap:12px}
.step{display:flex;gap:12px;align-items:flex-start}
.step b{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--paper-raised);display:flex;align-items:center;justify-content:center;font:700 14px/20px var(--zen);flex:none}
.illus{border-radius:24px;background:var(--paper-sunken);display:flex;justify-content:center;align-items:center;padding:16px}
.prog{display:flex;gap:6px}
.prog i{display:block;height:4px;flex:1;border-radius:2px;background:var(--line-strong)}
.prog i.on{background:var(--ink)}

/* Home */
.hhead{position:absolute;left:0;top:54px;width:393px;height:60px;padding:0 16px;display:flex;align-items:center;gap:12px;background:var(--paper-base);z-index:3}
.hview{position:absolute;left:0;top:114px;width:393px;height:738px;overflow:hidden}
.hcol{position:absolute;left:16px;width:361px;display:flex;flex-direction:column;gap:12px;padding-bottom:12px}
.state{display:flex;gap:12px;align-items:flex-start;padding-top:12px;border-top:1px solid var(--line)}
.state:first-of-type{border-top:0;padding-top:0}
.pill{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:999px;font:700 12px/16px var(--zen);letter-spacing:.02em;flex:none;color:var(--ink);border:1px solid var(--ink-2)}
.pill.care{background:var(--care-soft)}
.pill.ok{background:var(--ok-soft)}
.pill.alert{background:var(--alert-soft)}

/* Timeline */
.tl-day{display:flex;justify-content:space-between;align-items:baseline;padding:8px 16px}
.tl-row{display:flex;gap:8px;padding:0 16px}
.tl-time{width:40px;flex:none;padding-top:14px;color:var(--ink-2)}
.tl-rail{width:24px;flex:none;display:flex;flex-direction:column;align-items:center;padding-top:10px}
.tl-rail i{display:block;width:2px;flex:1;background:var(--line-strong);margin-top:4px;opacity:.5}
.tl-card{flex:1;min-width:0;margin-bottom:10px;padding:12px;border-radius:16px;background:var(--paper-raised);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.tl-card.miss{background:var(--alert-soft);border:2px solid var(--alert)}

/* Calendar */
.mini{margin:0 16px 4px;width:361px;padding:8px;border-radius:16px;background:var(--paper-raised);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;text-align:left}
.mini-head{display:flex;justify-content:space-between;align-items:center;padding:0 8px;height:24px}
.mini-days{display:grid;grid-template-columns:repeat(7,1fr)}
.mini-day{height:60px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.mini-day.sel{background:var(--ink);color:var(--paper-raised)}
.mark{height:12px;display:flex;align-items:center;justify-content:center}
.mark i{display:block;width:6px;height:6px;border-radius:50%;background:var(--line-strong)}
.mini-day.sel .mark i{background:var(--paper-raised)}
.scrim{position:absolute;left:0;top:0;width:393px;height:852px;background:rgba(0,0,0,.5);z-index:3}
.grip{height:20px;padding-top:8px;display:flex;justify-content:center;flex:none}
.grip i{display:block;width:40px;height:4px;border-radius:2px;background:var(--line-strong)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.cal-w{height:24px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.cal-d{height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.cal-d b{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:500 14px/18px var(--mono)}
.cal-d.sel b{background:var(--ink);color:var(--paper-raised)}
.cal-d.today b{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cal-d.future b{color:var(--ink-3);font-weight:400}

/* Log */
.log{display:flex;flex-direction:column;gap:12px}
.say{display:grid;grid-template-columns:40px 1fr;gap:8px}
.say .t{padding-top:2px;color:var(--ink-2)}
.say .who{font:700 12px/16px var(--zen);letter-spacing:.02em}
.say.flag .who{display:flex;align-items:center;gap:8px}
.say.flag .txt{background:var(--care-soft);border:1px solid var(--ink-2);border-radius:8px;padding:4px 8px;margin:2px 0 0 -8px}

/* Foundations */
.found{display:flex;flex-direction:column;gap:32px}
.found-grid{display:flex;gap:64px;align-items:flex-start}
.swatches{display:flex;flex-wrap:wrap;gap:12px;width:760px}
.swatch{width:112px;display:flex;flex-direction:column;gap:6px}
.swatch i{display:block;height:64px;border-radius:12px;border:1px solid rgba(0,0,0,.25)}
.spec{flex:1;display:flex;flex-direction:column;gap:20px}
.spec>div{display:flex;flex-direction:column;gap:4px}
</style>
</head>
<body>
<main class="board" id="board"></main>
<script>
const INK='#1A1A1A',INK2='#4D5359',RAISED='#FFFFFF',SUNKEN='#E2E3E6',ALERT='#DC3800',OK='#35A16B',CARE='#FF9900',NIGHT='#1F2328',NLINE='#7F878F',NTEXT='#FFFFFF',NTEXT2='#D0D3D8',NRAISED='#2D3238',AI_C='#0041FF',HANA='#663300',GREY='#7F878F';
const PHONE='<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>';
const IC={
 phone:PHONE,
 'phone-missed':PHONE+'<line x1="22" x2="16" y1="2" y2="8"/><line x1="16" x2="22" y1="2" y2="8"/>',
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 list:'<path d="M3 12h.01"/><path d="M3 18h.01"/><path d="M3 6h.01"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M8 6h13"/>',
 'calendar-clock':'<path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/>',
 utensils:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
 moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
 heart:'<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27"/>',
 alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
 rotate:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',
 bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
 lock:'<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
 square:'<rect width="18" height="18" x="3" y="3" rx="2"/>',
 play:'<polygon points="6 3 20 12 6 21 6 3"/>',
 plus:'<path d="M5 12h14"/><path d="M12 5v14"/>',
 x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
 'chevron-left':'<path d="m15 18-6-6 6-6"/>',
 'chevron-right':'<path d="m9 18 6-6-6-6"/>',
 'chevron-down':'<path d="m6 9 6 6 6-6"/>',
 sparkles:'<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',
 pencil:'<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
 eye:'<path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/>',
 mail:'<rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>',
};
const FILLED=new Set(['square','play']);
const icon=(k,s=24,c=INK)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="${FILLED.has(k)?c:'none'}" stroke="${c}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[k]}</svg>`;

const rng=seed=>{let s=seed%2147483647;if(s<=0)s+=2147483646;return()=>{s=s*16807%2147483647;return(s-1)/2147483646}};
const bars=(seed,n,H,min=3)=>{const r=rng(seed*7919+13);let v=.5;const out=[];for(let i=0;i<n;i++){v=v*.5+r()*.5;const env=.5+.5*Math.abs(Math.sin(i/n*Math.PI*(1+seed%3)+seed));out.push(Math.max(min,Math.min(H,Math.pow(v*env*1.5,1.1)*H)))}return out};
const wavePath=(hs,x0,H,w,g)=>hs.map((h,i)=>{const x=x0+i*(w+g),y=(H-h)/2,r=w/2;return`M${x.toFixed(2)} ${(y+r).toFixed(2)}a${r} ${r} 0 0 1 ${w} 0v${(h-w).toFixed(2)}a${r} ${r} 0 0 1 ${-w} 0z`}).join('');
const wave=(seed,W,H,c)=>{const w=3,g=2,n=Math.floor((W+g)/(w+g));return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path fill="${c}" d="${wavePath(bars(seed,n,H),0,H,w,g)}"/></svg>`};

const status=(t,night)=>`<div class="status" style="color:${night?NTEXT:INK}"><span>${t}</span><svg width="68" height="13" viewBox="0 0 68 13" fill="${night?NTEXT:INK}" aria-hidden="true"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="6" width="3" height="6" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y=".5" width="3" height="11.5" rx="1"/><path d="M31 12l-2.4-3a3.6 3.6 0 0 1 4.8 0L31 12zM25.8 5.6l1.6 1.9a5.6 5.6 0 0 1 7.2 0l1.6-1.9a8.2 8.2 0 0 0-10.4 0zM23 2.4l1.7 1.9a10 10 0 0 1 12.6 0L39 2.4a12.6 12.6 0 0 0-16 0z"/><rect x="44" y="1" width="21" height="11" rx="3" fill="none" stroke="${night?NTEXT:INK}" stroke-opacity=".4"/><rect x="46" y="3" width="17" height="7" rx="1.5"/></svg></div>`;
const homebar=()=>`<div class="homebar"><i></i></div>`;
const navBar=(ic,label,title='')=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 16px"><button class="iconbtn" aria-label="${label}">${icon(ic)}</button><span class="title-m">${title}</span><span style="width:44px"></span></div>`;
const aiTag=(t='Geminiのまとめ',c=INK2,cls='muted')=>`<div class="ai-tag">${icon('sparkles',16,c)}<span class="label-s ${cls}">${t}</span></div>`;
const tabs=on=>`<div class="sheet"><div class="dock">${[['home','ホーム','home'],['calls','通話記録','list'],['book','予約電話','calendar-clock']].map(([k,l,ic])=>`<button class="dockact ${on===k?'on':''}"${on===k?' aria-current="page"':''}>${icon(ic,24,on===k?INK:INK2)}<span>${l}</span></button>`).join('')}</div>${homebar()}</div>`;

const device=(lamp='off',w=280,ring=true)=>{
 const L={off:[GREY,0],on:['#FAF500',1],ok:[OK,1],fail:[GREY,0]}[lamp];
 let keys='';for(let r=0;r<4;r++)for(let c=0;c<3;c++)keys+=`<rect x="${84+c*30}" y="${100+r*20}" width="22" height="13" rx="4" fill="#FFFFFF" stroke="${GREY}"/>`;
 return`<svg width="${w}" height="${Math.round(w*208/320)}" viewBox="0 0 320 208" fill="none" aria-hidden="true">
 <path d="M58 88C60 74 72 68 86 68H234C248 68 260 74 262 88L276 182C278 194 270 200 258 200H62C50 200 42 194 44 182Z" fill="#C8C8CB" stroke="${INK}" stroke-width="2.5"/>
 <path d="M36 46C36 22 66 12 160 12S284 22 284 46V56C284 66 276 70 264 70H238C228 70 222 64 222 56V48C222 42 200 38 160 38S98 42 98 48V56C98 64 92 70 82 70H56C44 70 36 66 36 56Z" fill="${INK}"/>
 ${keys}
 ${L[1]?`<circle cx="228" cy="104" r="17" fill="${L[0]}" fill-opacity=".55"/>`:''}
 <circle cx="228" cy="104" r="8" fill="${L[0]}" stroke="${INK}" stroke-width="2"/>
 ${ring?`<circle cx="228" cy="154" r="24" stroke="${ALERT}" stroke-width="2.5" stroke-dasharray="5 5"/>`:''}
 <circle cx="228" cy="154" r="15" fill="#FFFFFF" stroke="${INK}" stroke-width="2.5"/>
 <circle cx="228" cy="154" r="7" fill="${INK}"/>
 </svg>`};
